name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      coverage-command:
        type: string
        default: 'yarn workspaces foreach -A run test --coverage'
      run-check:
        type: boolean
        default: true
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            votes/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn workspaces foreach -A run lint
      - run: ${COVERAGE_COMMAND}
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
      - run: yarn forge check --skip-remote
        if: ${{ inputs.run-check }}
        continue-on-error: true
      - name: collect coverage paths
        id: coverage
        run: |
          paths=$(find votes -name 'lcov.info' 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "paths=$paths" >> $GITHUB_OUTPUT
      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage.outputs.paths != ''
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.paths }}
