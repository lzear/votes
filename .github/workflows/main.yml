name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: lzear/forge/.github/workflows/ci.yml@e8a9ddb9b6369316b7a8f7f56d266fa52e51adfc # v5.2.0
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: lzear/forge/.github/workflows/release.yml@e8a9ddb9b6369316b7a8f7f56d266fa52e51adfc # v5.2.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
