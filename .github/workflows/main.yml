name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  # opens the "Version Packages" PR while changesets are pending
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # persist-credentials stays on: changesets/action pushes the
      # "Version Packages" branch with the checked-out credentials
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: yarn changeset version
      # nothing pending and no release yet for this version: publish it
      - id: release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          tag="votes@$(jq -r .version votes/package.json)"
          gh release view "$tag" > /dev/null 2>&1 || echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # stages on npm (approve with 2FA), then creates the GitHub release, whose
  # tag marks the version as done
  publish:
    needs: version
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: npm stage publish --workspace=votes --access public
      - run: |
          awk '/^## /{n++} n==1' votes/CHANGELOG.md | tail -n +2 > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}

  # stages a snapshot on every push to beta, no PR, no git tag
  beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn changeset version --snapshot beta
      - run: npm stage publish --workspace=votes --access public --tag beta
