name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: lzear/forge/.github/workflows/ci.yml@07849abe83379a1eb8eca9c348112fef27caaef5 # v5.0.0
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: lzear/forge/.github/workflows/release.yml@07849abe83379a1eb8eca9c348112fef27caaef5 # v5.0.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
