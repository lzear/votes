name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: lzear/forge/.github/workflows/ci.yml@de870ca6954863269d6a3b43a256f7b7e002a37a # v6.1.0
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: lzear/forge/.github/workflows/release.yml@de870ca6954863269d6a3b43a256f7b7e002a37a # v6.1.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
