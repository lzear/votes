name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: lzear/forge/.github/workflows/ci.yml@d2ec5167d6e30bd6dffe8c566f56d45a78ecd71f # v5.1.0
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: lzear/forge/.github/workflows/release.yml@d2ec5167d6e30bd6dffe8c566f56d45a78ecd71f # v5.1.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
