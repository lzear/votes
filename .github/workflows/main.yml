name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: lzear/forge/.github/workflows/ci.yml@a1ca03157aa99911896e38bea26aebbdc1e31796 # v4.7.0
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: lzear/forge/.github/workflows/release.yml@a1ca03157aa99911896e38bea26aebbdc1e31796 # v4.7.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
