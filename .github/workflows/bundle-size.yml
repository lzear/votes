name: Bundle-size

on:
  pull_request:
    branches:
      - main

jobs:
  size:
    runs-on: ubuntu-latest
    # compressed-size-action comments the size diff on the PR
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lzear/forge/actions/setup@a1ca03157aa99911896e38bea26aebbdc1e31796 # v4.7.0
      - run: yarn workspace votes build
      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          pattern: '**/dist/**/*.{mjs,js}'
