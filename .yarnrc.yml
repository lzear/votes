# dependency install scripts stay off; lefthook is installed by `prepare`
enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 3d

# own packages skip the gate
npmPreapprovedPackages:
  - "@lzear/*"
  # needed by @lzear/eslint-config 4.6; drop after 2026-10-06
  - eslint-package-json

npmRegistryServer: "https://registry.npmjs.org"
