# ~/.lefthookrc puts the toolchain on PATH: hooks run under /bin/sh, which reads
# no shell config, so a GUI git client has no node. Missing file is ignored.
rc: $HOME/.lefthookrc

# Bins by path, so one file serves every package manager: lefthook doesn't put
# node_modules/.bin on PATH.
pre-commit:
  jobs:
    # lefthook hides unstaged hunks while it fixes and restages
    - name: eslint
      glob: '*.{js,cjs,mjs,jsx,ts,cts,mts,tsx,json,jsonc,md,yml,yaml}'
      run: node_modules/.bin/eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    # scans the staged changes before the commit exists; without the binary
    # (cloud sessions, fresh machines), CI's gitleaks job still gates
    - name: gitleaks
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-commit --staged --redact --no-banner --verbose --log-level warn
        else
          echo 'gitleaks not installed: CI scans'
        fi

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}
